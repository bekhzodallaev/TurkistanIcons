name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Prisma migrate + seed (Postgres 16)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turkistan_icons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turkistan_icons"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turkistan_icons?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty DB
        run: pnpm --filter @turkistan/api exec prisma migrate deploy

      - name: Seed categories + tags
        run: pnpm --filter @turkistan/api exec prisma db seed

      - name: Assert schema is in sync (no drift / no pending migration)
        run: pnpm --filter @turkistan/api exec prisma migrate status

  health:
    name: API /health smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build types + api
        run: pnpm --filter @turkistan/types build && pnpm --filter @turkistan/api build

      - name: Start API and curl /health
        working-directory: apps/api
        env:
          NODE_ENV: production
          API_PORT: 4000
          # Production boot requires strong JWT secrets (validated in env.ts).
          # CI-only smoke values — not real secrets.
          JWT_ACCESS_SECRET: ci-smoke-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-smoke-refresh-secret-0123456789abcdef
        run: |
          node dist/main.js &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /tmp/health.json; then
              echo "health OK:"; cat /tmp/health.json; kill $API_PID; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"; kill $API_PID || true; exit 1
